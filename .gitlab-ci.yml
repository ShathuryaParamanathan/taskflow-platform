stages:
  - lint
  - test
  - security
  - terraform_validate
  - build
  - deploy

default:
  image: node:24-alpine

lint:
  stage: lint
  script:
    - cd app
    - npm ci
    - node --check src/server.js

test:
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: taskflow
    POSTGRES_USER: taskflow_user
    POSTGRES_PASSWORD: ci_taskflow_password
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: taskflow
    DB_USER: taskflow_user
    DB_PASSWORD: ci_taskflow_password
  script:
    - cd app
    - npm ci
    - node ci-db-setup.cjs
    - npm test

security_scan:
  stage: security
  image: node:24-alpine
  script:
    - cd app
    - npm ci
    - npm audit --omit=dev

terraform_validate:
  stage: terraform_validate
  image:
    name: hashicorp/terraform:1.16.6
    entrypoint: [""]
  script:
    - cd terraform
    - terraform init -backend=false
    - terraform validate
    - terraform fmt -check -recursive

build_push_ecr:
  stage: build
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    AWS_DEFAULT_REGION: "ap-south-1"
    ECR_REGISTRY: "440744236554.dkr.ecr.ap-south-1.amazonaws.com"
    ECR_REPOSITORY: "taskflow-api"
    AWS_ROLE_ARN: "arn:aws:iam::440744236554:role/GitLabTaskFlowECRPushRole"
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  script:
    - apk add --no-cache aws-cli
    - 'echo "$AWS_ID_TOKEN" > "$CI_PROJECT_DIR/aws_web_identity_token"'
    - chmod 600 "$CI_PROJECT_DIR/aws_web_identity_token"
    - export AWS_WEB_IDENTITY_TOKEN_FILE="$CI_PROJECT_DIR/aws_web_identity_token"
    - export AWS_ROLE_SESSION_NAME="gitlab-taskflow-${CI_PIPELINE_ID}"
    - aws sts get-caller-identity
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    - docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA" ./app
    - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA"
    - rm -f "$CI_PROJECT_DIR/aws_web_identity_token"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_ecs:
  stage: deploy
  image: alpine:3.21

  needs:
    - job: build_push_ecr

  variables:
    AWS_DEFAULT_REGION: "ap-south-1"
    AWS_ROLE_ARN: "arn:aws:iam::440744236554:role/GitLabTaskFlowECRPushRole"
    ECS_CLUSTER: "taskflow-dev-cluster"
    ECS_SERVICE: "taskflow-dev-api"
    TASK_DEFINITION_FAMILY: "taskflow-dev-api"
    CONTAINER_NAME: "taskflow-api"
    ECR_REGISTRY: "440744236554.dkr.ecr.ap-south-1.amazonaws.com"
    ECR_REPOSITORY: "taskflow-api"

  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com

  script:
    - apk add --no-cache aws-cli jq
    - 'echo "$AWS_ID_TOKEN" > "$CI_PROJECT_DIR/aws_web_identity_token"'
    - chmod 600 "$CI_PROJECT_DIR/aws_web_identity_token"
    - export AWS_WEB_IDENTITY_TOKEN_FILE="$CI_PROJECT_DIR/aws_web_identity_token"
    - export AWS_ROLE_SESSION_NAME="gitlab-taskflow-deploy-${CI_PIPELINE_ID}"
    - aws sts get-caller-identity
    - export NEW_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${CI_COMMIT_SHORT_SHA}"
    - 'echo "Deploying image: $NEW_IMAGE"'
    - aws ecs describe-task-definition --task-definition "$TASK_DEFINITION_FAMILY" --query taskDefinition --output json > current-task-definition.json
    - |
      jq --arg image "$NEW_IMAGE" --arg container "$CONTAINER_NAME" '
        if ([.containerDefinitions[] | select(.name == $container)] | length) != 1
        then error("Expected exactly one matching container")
        else
          del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .deregisteredAt
          )
          | .containerDefinitions |= map(
              if .name == $container
              then .image = $image
              else .
              end
            )
        end
      ' current-task-definition.json > new-task-definition.json
    - aws ecs register-task-definition --cli-input-json file://new-task-definition.json --query taskDefinition.taskDefinitionArn --output text > new-task-definition-arn.txt
    - export NEW_TASK_DEFINITION_ARN="$(cat new-task-definition-arn.txt)"
    - 'echo "Registered task definition: $NEW_TASK_DEFINITION_ARN"'
    - aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEW_TASK_DEFINITION_ARN"
    - aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
    - 'echo "TaskFlow deployment completed successfully."'
    - rm -f "$CI_PROJECT_DIR/aws_web_identity_token"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
